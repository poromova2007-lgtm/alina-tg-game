<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Ведущая</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: sans-serif; background: #ffe4ec; padding: 20px; color: #4a2c17; margin: 0; }
  h1 { text-align: center; color: #6b4226; }
  .btn { padding: 10px 20px; border-radius: 20px; border: none; background: #6b4226; color: white; font-weight: bold; cursor: pointer; }
  .teams-bar { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .team-score { background: #fff; padding: 15px 30px; border-radius: 20px; font-size: 1.5em; font-weight: bold; border: 3px solid #ff9ebb; }
  #board { display: grid; gap: 10px; }
  .cell { background: #ff9ebb; padding: 20px; text-align: center; border-radius: 10px; font-weight: bold; font-size: 1.5em; cursor: pointer; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; padding: 20px; }
  .modal.show { display: flex; }
  .modal-content { background: #fff; padding: 30px; border-radius: 20px; max-width: 800px; width: 100%; text-align: center; }
  .vote-option { background: #eee; padding: 15px; margin: 10px 0; border-radius: 10px; font-size: 1.2em; position: relative; overflow: hidden; }
  .vote-bar { position: absolute; left: 0; top: 0; bottom: 0; background: #7ec97e; z-index: 1; transition: width 0.5s; }
  .vote-text { position: relative; z-index: 2; font-weight: bold; }
</style>
</head>
<body>
  <h1>🎂 Ведущая</h1>
  <div style="text-align:center; margin-bottom:15px;">
    <button class="btn" style="background:#ffb347;" onclick="setupTeams()">⚙️ Настроить команды</button>
  </div>
  <div class="teams-bar" id="teamsBar"></div>
  <div id="board"></div>

  <div class="modal" id="modal">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    let gameData = null;
    let state = { teams: [], currentQuestion: null };
    let ws;

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'state') {
          state = msg.state;
          updateUI();
        }
        if (msg.type === 'tick') {
          const timerEl = document.getElementById('timerDisplay');
          if (timerEl) timerEl.textContent = `Осталось: ${msg.timeLeft} сек.`;
        }
      };
    }

    async function loadGame() {
      const res = await fetch('/api/game');
      gameData = await res.json();
      if (!gameData) {
        // Заглушка, если база пустая
        gameData = { rounds: [{ name: "Раунд 1", prices: [100, 200], categories: [{ name: "Категория", questions: [
          { price: 100, question: "Кто круче?", isVote: true, choices: ["Вася", "Петя", "Коля"], answer: "Победит большинство" }
        ] }] }] };
      }
      renderBoard();
    }

    function updateUI() {
      const tb = document.getElementById('teamsBar');
      tb.innerHTML = '';
      state.teams.forEach(t => {
        tb.innerHTML += `<div class="team-score">${t.name}: ${t.score} очков</div>`;
      });
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const rData = gameData.rounds[0];
      board.style.gridTemplateColumns = `repeat(${rData.categories.length}, 1fr)`;
      
      rData.categories.forEach(c => {
        const h = document.createElement('div'); h.className = 'cell'; h.textContent = c.name; board.appendChild(h);
      });
      rData.prices.forEach((p, row) => {
        rData.categories.forEach((c, ci) => {
          const cell = document.createElement('div'); cell.className = 'cell'; cell.textContent = p;
          cell.onclick = () => openQuestion(ci, row);
          board.appendChild(cell);
        });
      });
    }

    function setupTeams() {
      const count = prompt('Сколько будет команд? (например, 3)', '2');
      if (!count) return;
      const num = parseInt(count);
      if (isNaN(num) || num < 1) return alert('Введи число');
      
      const newTeams = [];
      for (let i = 1; i <= num; i++) {
        const name = prompt(`Название команды ${i}:`, `Команда ${i}`);
        newTeams.push({ id: i, name: name || `Команда ${i}`, score: 0 });
      }
      ws.send(JSON.stringify({ type: 'updateTeams', teams: newTeams }));
      alert('Команды настроены! Теперь пусть игроки заходят и выбирают свою.');
    }

    function openQuestion(ci, row) {
      const q = gameData.rounds[0].categories[ci].questions[row];
      if (q.isVote) {
        ws.send(JSON.stringify({ type: 'openQuestion', question: { ...q, isVote: true } }));
        document.getElementById('modalContent').innerHTML = `
          <h2>${q.question}</h2>
          <div id="timerDisplay" style="font-size:1.5em; color:red; margin:10px 0;">Осталось: 20 сек.</div>
          <div id="voteResults"></div>
          <button class="btn" onclick="closeQuestion()">Закрыть</button>
        `;
        setInterval(updateVoteResults, 500);
      } else {
        ws.send(JSON.stringify({ type: 'openQuestion', question: { ...q, isVote: false } }));
        document.getElementById('modalContent').innerHTML = `<h2>${q.question}</h2><p>Ответ: ${q.answer}</p><button class="btn" onclick="closeQuestion()">Закрыть</button>`;
      }
      document.getElementById('modal').classList.add('show');
    }

    function updateVoteResults() {
      if (!state.currentQuestion || !state.currentQuestion.isVote) return;
      const container = document.getElementById('voteResults');
      if (!container) return;
      
      const counts = {};
      Object.values(state.votes).forEach(v => counts[v] = (counts[v] || 0) + 1);
      const totalVotes = Object.keys(state.votes).length || 1;

      let html = '';
      state.currentQuestion.choices.forEach((choice, idx) => {
        const votesCount = counts[idx] || 0;
        const percent = Math.round((votesCount / totalVotes) * 100);
        html += `
          <div class="vote-option">
            <div class="vote-bar" style="width: ${percent}%; background: ${state.currentQuestion.winningChoice === idx ? '#7ec97e' : '#ffb347'};"></div>
            <div class="vote-text">${choice} — ${votesCount} голосов (${percent}%)</div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function closeQuestion() {
      ws.send(JSON.stringify({ type: 'closeQuestion' }));
      document.getElementById('modal').classList.remove('show');
    }

    connect();
    loadGame();
  </script>
</body>
</html>
