<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Ведущая</title>
<style>
  :root { --bg1: #ffe4ec; --bg2: #ffc2d4; --brown: #6b4226; --pink-deep: #ff9ebb; --text: #4a2c17; }
  body { font-family: sans-serif; background: linear-gradient(135deg, var(--bg1), var(--bg2)); min-height: 100vh; color: var(--text); padding: 20px; margin: 0; }
  h1 { text-align: center; color: var(--brown); font-size: 3em; text-shadow: 3px 3px 0 var(--pink-deep); margin: 10px 0; }
  .btn { padding: 12px 25px; border-radius: 30px; border: none; background: var(--brown); color: white; font-weight: bold; cursor: pointer; font-size: 1em; margin: 5px; }
  .btn.pink { background: var(--pink-deep); color: var(--text); }
  .btn.green { background: #7ec97e; color: white; }
  .btn.red { background: #c04040; color: white; }
  .btn.blue { background: #5c9ce6; color: white; }
  
  /* ЭКРАН НАСТРОЙКИ */
  #setupScreen { background: #fff5f0; max-width: 500px; margin: 50px auto; padding: 30px; border-radius: 20px; border: 3px solid var(--pink-deep); text-align: center; }
  #setupScreen select, #setupScreen input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 10px; border: 2px solid var(--pink-deep); box-sizing: border-box; }

  /* ИГРОВОЕ ПОЛЕ */
  #gameScreen { display: none; max-width: 1400px; margin: 0 auto; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  #teamsBar { display: flex; gap: 15px; flex-wrap: wrap; }
  .team-score { background: #fff; padding: 10px 20px; border-radius: 15px; font-weight: bold; border: 2px solid var(--pink-deep); }
  #board { display: grid; gap: 10px; background: rgba(255,255,255,.4); padding: 15px; border-radius: 20px; }
  .category-header { background: var(--brown); color: white; padding: 15px; text-align: center; border-radius: 10px; font-weight: bold; }
  .cell { background: var(--pink-deep); color: var(--text); padding: 25px; text-align: center; border-radius: 10px; font-size: 1.5em; font-weight: bold; cursor: pointer; border: 2px solid white; }
  .cell:hover { transform: scale(1.02); }
  .cell.used { opacity: 0.3; pointer-events: none; }

  /* МОДАЛКИ */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal.show { display: flex; }
  .modal-content { background: #fff5f0; padding: 30px; border-radius: 20px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; text-align: center; border: 4px solid var(--pink-deep); }
  
  /* РЕДАКТОР */
  #editorModal { z-index: 200; }
  .editor-tabs { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; flex-wrap: wrap; }
  .editor-tab { padding: 8px 15px; background: #eee; border-radius: 10px; cursor: pointer; font-weight: bold; }
  .editor-tab.active { background: var(--brown); color: white; }
  .question-block { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; text-align: left; border: 1px solid #ddd; }
  textarea, input[type="text"] { width: 100%; padding: 8px; margin-bottom: 5px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }

  /* ГОЛОСОВАНИЕ */
  .vote-option { background: #eee; padding: 15px; margin: 10px 0; border-radius: 10px; font-size: 1.2em; position: relative; overflow: hidden; }
  .vote-bar { position: absolute; left: 0; top: 0; bottom: 0; background: #7ec97e; z-index: 1; transition: width 0.5s; }
  .vote-text { position: relative; z-index: 2; font-weight: bold; }
</style>
</head>
<body>

<h1>🎂 Ведущая</h1>

<!-- ЭКРАН НАСТРОЙКИ -->
<div id="setupScreen">
  <h2>Настройка игры</h2>
  <label>Формат игры:</label>
  <select id="gameFormat" onchange="toggleFormat()">
    <option value="solo">Каждый сам за себя</option>
    <option value="teams">Игра по командам</option>
  </select>
  
  <div id="teamsSetup" style="display:none;">
    <label>Количество команд:</label>
    <input type="number" id="teamCount" value="2" min="2" max="10" onchange="renderTeamInputs()">
    <div id="teamInputs"></div>
  </div>

  <button class="btn green" style="width: 100%; margin-top: 20px;" onclick="startGame()">🚀 Начать игру</button>
  <button class="btn blue" style="width: 100%; margin-top: 10px;" onclick="openEditor()">⚙️ Редактор вопросов</button>
</div>

<!-- ИГРОВОЕ ПОЛЕ -->
<div id="gameScreen">
  <div class="top-bar">
    <div id="teamsBar"></div>
    <div>
      <button class="btn blue" onclick="location.reload()">🔄 Заново</button>
    </div>
  </div>
  <div id="board"></div>
</div>

<!-- МОДАЛКА ВОПРОСА -->
<div class="modal" id="questionModal">
  <div class="modal-content" id="questionModalContent"></div>
</div>

<!-- МОДАЛКА РЕДАКТОРА -->
<div class="modal" id="editorModal">
  <div class="modal-content">
    <h2>Редактор</h2>
    <div class="editor-tabs" id="editorTabs"></div>
    <div id="editorContent"></div>
    <button class="btn green" onclick="saveGameData()">💾 Сохранить вопросы</button>
    <button class="btn red" onclick="document.getElementById('editorModal').classList.remove('show')">Закрыть</button>
  </div>
</div>

<script>
  let ws;
  let gameData = { rounds: [{ name: "Раунд 1", prices: [100, 200, 300, 400, 500], categories: [] }] };
  let state = { players: [], teams: [], currentQuestion: null, votes: {}, timer: 0 };
  let isTeamMode = false;
  let edRound = 0;

  // ============ ПОДКЛЮЧЕНИЕ ============
  function connect() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${location.host}`);
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'state') {
        state = msg.state;
        renderScores();
        updateQuestionUI();
      }
    };
  }

  // ============ НАСТРОЙКА И СТАРТ ============
  function toggleFormat() {
    const format = document.getElementById('gameFormat').value;
    isTeamMode = (format === 'teams');
    document.getElementById('teamsSetup').style.display = isTeamMode ? 'block' : 'none';
    if (isTeamMode) renderTeamInputs();
  }

  function renderTeamInputs() {
    const count = parseInt(document.getElementById('teamCount').value) || 2;
    const container = document.getElementById('teamInputs');
    container.innerHTML = '';
    for (let i = 1; i <= count; i++) {
      container.innerHTML += `<input type="text" id="teamName_${i}" value="Команда ${i}" placeholder="Название команды ${i}">`;
    }
  }

  function startGame() {
    let teams = [];
    if (isTeamMode) {
      const count = parseInt(document.getElementById('teamCount').value) || 2;
      for (let i = 1; i <= count; i++) {
        teams.push({ id: i, name: document.getElementById(`teamName_${i}`).value, score: 0 });
      }
    }
    ws.send(JSON.stringify({ type: 'startGame', teams }));
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'block';
    loadGameData();
  }

  // ============ ЗАГРУЗКА ИГРЫ ============
  async function loadGameData() {
    try {
      const res = await fetch('/api/game');
      const data = await res.json();
      if (data && data.rounds) gameData = data;
    } catch(e) { console.log('База пуста, используем стандартную игру'); }
    
    // Если вопросов нет, создаем демо-структуру
    if (gameData.rounds[0].categories.length === 0) {
      for (let c = 0; c < 5; c++) {
        gameData.rounds[0].categories.push({
          name: `Категория ${c+1}`,
          questions: gameData.rounds[0].prices.map((p, i) => ({
            price: p, question: `Вопрос ${i+1}`, answer: `Ответ ${i+1}`, mediaUrl: '', isTest: false, isVote: false, choices: ['', '', '']
          }))
        });
      }
    }
    renderBoard();
  }

  // ============ ОТРИСОВКА ============
  function renderScores() {
    const bar = document.getElementById('teamsBar');
    bar.innerHTML = '';
    if (state.teams && state.teams.length > 0) {
      state.teams.forEach(t => {
        bar.innerHTML += `<div class="team-score">${t.name}: <span style="color:#6b4226">${t.score}</span></div>`;
      });
    } else {
      // Личный зачет
      const sorted = [...state.players].sort((a,b) => b.score - a.score);
      sorted.forEach(p => {
        bar.innerHTML += `<div class="team-score" style="font-size:0.9em; padding:5px 15px;">${p.name}: ${p.score}</div>`;
      });
    }
  }

  function renderBoard() {
    const board = document.getElementById('board');
    board.innerHTML = '';
    const rData = gameData.rounds[edRound];
    board.style.gridTemplateColumns = `repeat(${rData.categories.length}, 1fr)`;
    
    rData.categories.forEach(c => {
      const h = document.createElement('div'); h.className = 'category-header'; h.textContent = c.name; board.appendChild(h);
    });
    
    rData.prices.forEach((p, row) => {
      rData.categories.forEach((c, ci) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = p;
        cell.onclick = () => openQuestion(ci, row, cell);
        board.appendChild(cell);
      });
    });
  }

  // ============ ВОПРОС ============
  function openQuestion(ci, row, cell) {
    const q = gameData.rounds[edRound].categories[ci].questions[row];
    cell.classList.add('used');
    ws.send(JSON.stringify({ type: 'openQuestion', question: { ...q, catIdx: ci, row: row } }));
    
    const modal = document.getElementById('questionModal');
    const content = document.getElementById('questionModalContent');
    
    let html = `<h2 style="color:#6b4226;">${q.question}</h2>`;
    if (q.mediaUrl) html += `<img src="${q.mediaUrl}" style="max-width:100%; max-height:300px; border-radius:10px; margin:10px 0;">`;
    
    if (q.isVote) {
      html += `<div id="timerBox" style="font-size:2em; color:#c04040; font-weight:bold; margin:10px 0;">⏳ ${state.timer} сек.</div>`;
      html += `<div id="voteResults"></div>`;
    } else if (q.isTest) {
      html += `<div style="margin-top:20px; display:flex; flex-direction:column; gap:10px;">`;
      q.choices.forEach((ch, i) => {
        html += `<button class="btn" style="background:#fff; border:2px solid #ff9ebb; color:#4a2c17;" onclick="revealAnswer()">${ch}</button>`;
      });
      html += `</div>`;
    } else {
      html += `<button class="btn" onclick="revealAnswer()">Показать ответ</button>`;
    }
    
    html += `<div id="answerBox" style="display:none; margin-top:20px; padding:20px; background:#fff0f5; border-radius:15px; border:2px dashed #a4785c;">
      <h3 style="color:#6b4226;">Ответ: ${q.answer}</h3>
    </div>`;
    
    html += `<div id="buzzList" style="margin-top:20px; text-align:left;"></div>`;
    html += `<div style="margin-top:20px;"><button class="btn red" onclick="closeQuestion()">Закрыть вопрос</button></div>`;
    
    content.innerHTML = html;
    modal.classList.add('show');
    updateQuestionUI();
    if(q.isVote) setInterval(updateVoteUI, 500);
  }

  function revealAnswer() { document.getElementById('answerBox').style.display = 'block'; }

  function closeQuestion() {
    ws.send(JSON.stringify({ type: 'closeQuestion' }));
    document.getElementById('questionModal').classList.remove('show');
  }

  function updateQuestionUI() {
    if (!state.currentQuestion) return;
    
    // Таймер
    const timerBox = document.getElementById('timerBox');
    if (timerBox) timerBox.textContent = `⏳ ${state.timer} сек.`;

    // Список нажавших
    const buzzList = document.getElementById('buzzList');
    if (buzzList && !state.currentQuestion.isVote) {
      buzzList.innerHTML = '<h3>Кто нажал:</h3>';
      state.buzzQueue.forEach((b, i) => {
        const isFirst = i === 0;
        buzzList.innerHTML += `
          <div style="background:${isFirst ? '#ffb347' : '#eee'}; padding:10px; border-radius:10px; margin:5px 0; display:flex; justify-content:space-between; align-items:center;">
            <b>${i+1}. ${b.playerName}</b>
            <span>${b.answer ? '💬 ' + b.answer : '...'}</span>
            ${isFirst ? `
              <div>
                <button class="btn green" style="padding:5px 15px;" onclick="scoreCorrect()">✅ Верно</button>
                <button class="btn red" style="padding:5px 15px;" onclick="scoreWrong()">❌ Неверно</button>
              </div>
            ` : ''}
          </div>
        `;
      });
    }
  }

  function updateVoteUI() {
    if (!state.currentQuestion || !state.currentQuestion.isVote) return;
    const container = document.getElementById('voteResults');
    if (!container) return;
    
    const counts = {};
    Object.values(state.votes).forEach(v => counts[v] = (counts[v] || 0) + 1);
    const total = Object.keys(state.votes).length || 1;
    
    let html = '';
    state.currentQuestion.choices.forEach((choice, idx) => {
      const votes = counts[idx] || 0;
      const percent = Math.round((votes / total) * 100);
      const isWinner = state.currentQuestion.winningChoice === idx;
      html += `
        <div class="vote-option">
          <div class="vote-bar" style="width:${percent}%; background:${isWinner ? '#7ec97e' : '#ffb347'}"></div>
          <div class="vote-text">${choice} — ${votes} голосов (${percent}%)</div>
        </div>
      `;
    });
    container.innerHTML = html;
  }

  function scoreCorrect() {
    const first = state.buzzQueue[0];
    if (!first) return;
    ws.send(JSON.stringify({ type: 'correct', playerId: first.playerId, delta: state.currentQuestion.price }));
    revealAnswer();
  }

  function scoreWrong() {
    const first = state.buzzQueue[0];
    if (!first) return;
    ws.send(JSON.stringify({ type: 'wrong', playerId: first.playerId }));
  }

  // ============ РЕДАКТОР ============
  function openEditor() {
    document.getElementById('editorModal').classList.add('show');
    renderEditor();
  }

  function renderEditor() {
    const tabs = document.getElementById('editorTabs');
    const content = document.getElementById('editorContent');
    tabs.innerHTML = `<div class="editor-tab active">Раунд 1</div>`;
    
    const rData = gameData.rounds[0];
    content.innerHTML = '';
    
    rData.categories.forEach((cat, ci) => {
      let html = `<div style="background:#ffe4ec; padding:15px; border-radius:15px; margin-bottom:20px;">
        <input type="text" value="${cat.name}" onchange="gameData.rounds[0].categories[${ci}].name = this.value" style="font-weight:bold; font-size:1.2em;">
      `;
      
      cat.questions.forEach((q, qi) => {
        html += `<div class="question-block">
          <b>💰 ${q.price}</b><br>
          <label>Вопрос:</label>
          <textarea rows="2" onchange="gameData.rounds[0].categories[${ci}].questions[${qi}].question = this.value">${q.question}</textarea>
          <label>Ответ:</label>
          <textarea rows="2" onchange="gameData.rounds[0].categories[${ci}].questions[${qi}].answer = this.value">${q.answer}</textarea>
          
          <label>Фото/Видео (URL или загрузка):</label><br>
          <input type="text" value="${q.mediaUrl || ''}" placeholder="Ссылка на медиа" onchange="gameData.rounds[0].categories[${ci}].questions[${qi}].mediaUrl = this.value">
          
          <div style="margin-top:10px; display:flex; gap:20px;">
            <label><input type="checkbox" ${q.isVote ? 'checked' : ''} onchange="gameData.rounds[0].categories[${ci}].questions[${qi}].isVote = this.checked"> Голосование</label>
            <label><input type="checkbox" ${q.isTest ? 'checked' : ''} onchange="gameData.rounds[0].categories[${ci}].questions[${qi}].isTest = this.checked"> Тест (варианты)</label>
          </div>
          
          <div style="margin-top:10px;">
            <label>Варианты (для теста или голосования):</label>
            <input type="text" value="${q.choices[0]}" placeholder="Вариант 1" onchange="gameData.rounds[0].categories[${ci}].questions[${qi}].choices[0] = this.value">
            <input type="text" value="${q.choices[1]}" placeholder="Вариант 2" onchange="gameData.rounds[0].categories[${ci}].questions[${qi}].choices[1] = this.value">
            <input type="text" value="${q.choices[2]}" placeholder="Вариант 3" onchange="gameData.rounds[0].categories[${ci}].questions[${qi}].choices[2] = this.value">
          </div>
        </div>`;
      });
      html += `</div>`;
      content.innerHTML += html;
    });
  }

  async function saveGameData() {
    try {
      await fetch('/api/game', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ gameData })
      });
      alert('Вопросы сохранены в базу данных!');
      renderBoard();
    } catch(e) { alert('Ошибка сохранения'); }
  }

  // ============ ЗАПУСК ============
  connect();
  toggleFormat();
</script>
</body>
</html>
