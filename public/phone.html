<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Я в игре! 🎂</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: Georgia, serif; background: linear-gradient(135deg, #ffe4ec, #ffc2d4); min-height: 100vh; color: #4a2c17; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  h1 { font-size: 1.8em; color: #6b4226; margin-bottom: 20px; }
  #joinScreen { width: 100%; max-width: 400px; background: #fff5f0; border-radius: 24px; padding: 30px 25px; border: 3px solid #ff9ebb; }
  label { display: block; font-weight: bold; margin-bottom: 10px; font-size: 1.1em; }
  input, select { width: 100%; padding: 15px; border: 3px solid #ff9ebb; border-radius: 14px; font-size: 1.2em; font-family: inherit; text-align: center; margin-bottom: 20px; background: white; }
  button { width: 100%; padding: 20px; border: none; border-radius: 20px; font-family: inherit; font-weight: bold; font-size: 1.3em; color: #fff5f0; background: #6b4226; cursor: pointer; transition: 0.2s; }
  button:active { transform: scale(0.97); }
  
  #gameScreen { display: none; width: 100%; max-width: 500px; flex-direction: column; align-items: center; gap: 20px; }
  .playerName { background: #6b4226; color: #fff5f0; padding: 12px 25px; border-radius: 30px; font-weight: bold; font-size: 1.2em; }
  .status { font-size: 1em; color: #6b4226; font-style: italic; padding: 15px; background: rgba(255,255,255,.6); border-radius: 14px; width: 100%; }
  
  #buzzBtn { width: 100%; height: 220px; border-radius: 30px; font-size: 2.2em; background: linear-gradient(145deg, #c04040, #8b2020); box-shadow: 0 12px 30px rgba(192,64,64,.5); display: none; }
  #buzzBtn:disabled { background: #a4785c; opacity: 0.5; box-shadow: none; }
  
  #answerForm { display: none; width: 100%; flex-direction: column; gap: 12px; }
  #answerInput { border-color: #ffb347; }
  #sendAnswerBtn { background: #4a9d4a; }
  
  #voteForm { display: none; width: 100%; flex-direction: column; gap: 10px; }
  .vote-btn { background: #fff; color: #4a2c17; border: 3px solid #ff9ebb; font-size: 1.2em; }
  .vote-btn.selected { background: #7ec97e; color: white; border-color: #4a9d4a; }
</style>
</head>
<body>

<div id="joinScreen">
  <h1>🎂 Игра</h1>
  <label>Как тебя зовут?</label>
  <input type="text" id="nameInput" placeholder="Твоё имя" maxlength="20">
  
  <div id="teamSelectBox" style="display:none;">
    <label>Выбери команду:</label>
    <select id="teamSelect"></select>
  </div>
  
  <button id="joinBtn">Войти в игру 🎉</button>
</div>

<div id="gameScreen">
  <div class="playerName" id="myName">—</div>
  <div class="status" id="statusText">Ждём вопрос...</div>
  
  <button id="buzzBtn" disabled>Я ЗНАЮ!</button>
  
  <div id="answerForm">
    <input type="text" id="answerInput" placeholder="Твой ответ">
    <button id="sendAnswerBtn">Отправить ✓</button>
  </div>
  
  <div id="voteForm">
    <h3 id="voteQuestion" style="color:#6b4226; margin-bottom:10px;"></h3>
    <div id="voteOptions"></div>
  </div>
</div>

<script>
  let ws = null;
  let myId = null;
  let currentQuestion = null;
  let hasBuzzed = false;
  let hasVoted = false;

  const joinScreen = document.getElementById('joinScreen');
  const gameScreen = document.getElementById('gameScreen');
  const nameInput = document.getElementById('nameInput');
  const joinBtn = document.getElementById('joinBtn');
  const teamSelectBox = document.getElementById('teamSelectBox');
  const teamSelect = document.getElementById('teamSelect');
  const myNameEl = document.getElementById('myName');
  const statusText = document.getElementById('statusText');
  const buzzBtn = document.getElementById('buzzBtn');
  const answerForm = document.getElementById('answerForm');
  const answerInput = document.getElementById('answerInput');
  const sendAnswerBtn = document.getElementById('sendAnswerBtn');
  const voteForm = document.getElementById('voteForm');
  const voteQuestion = document.getElementById('voteQuestion');
  const voteOptions = document.getElementById('voteOptions');

  function connectWS() {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${protocol}//${location.host}`);
    ws.onopen = () => console.log('✅ Подключено');
    ws.onmessage = (e) => handleMessage(JSON.parse(e.data));
    ws.onclose = () => setTimeout(connectWS, 2000);
  }

  function handleMessage(msg) {
    if (msg.type === 'joined') {
      myId = msg.id;
      myNameEl.textContent = msg.name;
      joinScreen.style.display = 'none';
      gameScreen.style.display = 'flex';
      return;
    }
    if (msg.type === 'buzzed') {
      hasBuzzed = true;
      buzzBtn.style.display = 'none';
      answerForm.style.display = 'flex';
      statusText.textContent = 'Ты нажал ' + msg.position + '-м! Введи ответ:';
      answerInput.focus();
      return;
    }
    if (msg.type === 'state') {
      updateState(msg.state);
      return;
    }
  }

  function updateState(state) {
    if (state.teams && state.teams.length > 0 && teamSelect.options.length === 0) {
      teamSelectBox.style.display = 'block';
      state.teams.forEach(t => {
        const opt = document.createElement('option'); opt.value = t.id; opt.textContent = t.name; teamSelect.appendChild(opt);
      });
    }

    const q = state.currentQuestion;
    if (!q) {
      currentQuestion = null; hasBuzzed = false; hasVoted = false;
      buzzBtn.style.display = 'none'; answerForm.style.display = 'none'; voteForm.style.display = 'none';
      statusText.textContent = 'Ждём вопрос...';
      return;
    }

    if (!currentQuestion || currentQuestion.row !== q.row || currentQuestion.catIdx !== q.catIdx) {
      currentQuestion = q; hasBuzzed = false; hasVoted = false;
      answerForm.style.display = 'none'; answerInput.value = '';
      
      if (q.isVote) {
        buzzBtn.style.display = 'none'; voteForm.style.display = 'block';
        voteQuestion.textContent = q.question; voteOptions.innerHTML = '';
        q.choices.forEach((choice, idx) => {
          if (!choice.trim()) return;
          const btn = document.createElement('button'); btn.className = 'vote-btn'; btn.textContent = choice;
          btn.onclick = () => {
            if (hasVoted) return;
            ws.send(JSON.stringify({ type: 'vote', choiceIndex: idx }));
            voteOptions.querySelectorAll('.vote-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected'); hasVoted = true; statusText.textContent = 'Ты проголосовал!';
          };
          voteOptions.appendChild(btn);
        });
        statusText.textContent = 'Голосуй за вариант!';
      } else {
        voteForm.style.display = 'none'; buzzBtn.style.display = 'block'; buzzBtn.disabled = false;
        statusText.textContent = '🎯 Жми «Я ЗНАЮ!»';
        if (navigator.vibrate) navigator.vibrate(100);
      }
    }

    if (!q.isVote) {
      const iAmWrong = state.answeredWrong.includes(myId);
      const someoneBuzzed = state.buzzQueue.length > 0;
      if (hasBuzzed) {
        buzzBtn.style.display = 'none';
      } else if (iAmWrong) {
        buzzBtn.style.display = 'block'; buzzBtn.disabled = true; statusText.textContent = '❌ Ты ответил неверно';
      } else if (someoneBuzzed) {
        buzzBtn.style.display = 'block'; buzzBtn.disabled = true; statusText.textContent = '🔒 Кто-то отвечает...';
      } else {
        buzzBtn.style.display = 'block'; buzzBtn.disabled = false; statusText.textContent = '🎯 Жми «Я ЗНАЮ!»';
      }
    }
  }

  joinBtn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) return alert('Введи имя');
    const teamId = teamSelectBox.style.display === 'block' ? teamSelect.value : 0;
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'join', name, teamId }));
  });

  nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinBtn.click(); });
  buzzBtn.addEventListener('click', () => { if (buzzBtn.disabled || hasBuzzed) return; if (ws) ws.send(JSON.stringify({ type: 'buzz' })); });
  sendAnswerBtn.addEventListener('click', () => { const text = answerInput.value.trim(); if (!text) return; if (ws) { ws.send(JSON.stringify({ type: 'answer', text })); answerForm.style.display = 'none'; statusText.textContent = 'Ответ отправлен!'; } });
  answerInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendAnswerBtn.click(); });

  connectWS();
</script>
</body>
</html>
